[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "commercelab"
version = "1.0.0"
description = "Customer behavior and product analytics using GA4 ecommerce events"
requires-python = ">=3.10"
dependencies = ["pandas>=2.1,<4", "numpy>=1.26,<3", "streamlit>=1.38,<2", "altair>=6,<7"]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.25,<4", "db-dtypes>=1.3,<2", "pyarrow>=14,<24"]
dev = ["pytest>=9.0.3,<10", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
